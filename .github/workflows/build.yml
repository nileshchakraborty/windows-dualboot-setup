name: Build & Test RestartToBazzite

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Test Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Solution (Release)
        run: dotnet build RestartToBazzite.sln -c Release

      - name: Run Unit Tests
        run: dotnet test RestartToBazzite.sln -c Release --verbosity normal --no-build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RestartToBazzite-binaries
          path: |
            src/RestartToBazzite/bin/Release/**/RestartToBazzite.exe
            src/RestartToBazzite/RestartToBazzite.ico

      - name: Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src/RestartToBazzite/bin/Release/net48/RestartToBazzite.exe
            src/RestartToBazzite/RestartToBazzite.ico
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
